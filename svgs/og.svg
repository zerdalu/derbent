<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1200"
  height="630"
  viewBox="0 0 1200 630"
  fill="none"
>
  <title>Derbent</title>
  <defs>
    <!-- Deep Obsidian Canvas Gradients -->
    <linearGradient id="canvas-bg" x1="600" y1="0" x2="600" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#12141a" />
      <stop offset="55%" stop-color="#0a0b0f" />
      <stop offset="100%" stop-color="#060709" />
    </linearGradient>

    <radialGradient
      id="core-spotlight"
      cx="0"
      cy="0"
      r="1"
      gradientUnits="userSpaceOnUse"
      gradientTransform="translate(600 265) rotate(90) scale(340 540)"
    >
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.14" />
      <stop offset="45%" stop-color="#94a3b8" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <radialGradient
      id="top-horizon"
      cx="0"
      cy="0"
      r="1"
      gradientUnits="userSpaceOnUse"
      gradientTransform="translate(600 0) rotate(90) scale(220 700)"
    >
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>

    <!-- Stepped Diamond Vault Gradients -->
    <linearGradient id="diamond-rim-outer" x1="300" y1="40" x2="900" y2="540" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.22" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.16" />
    </linearGradient>

    <linearGradient id="diamond-rim-inner" x1="400" y1="90" x2="800" y2="440" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.24" />
    </linearGradient>

    <linearGradient id="diamond-surface-md" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#171921" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#0b0c10" stop-opacity="0.55" />
    </linearGradient>

    <linearGradient id="diamond-surface-sm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1b1e27" stop-opacity="0.78" />
      <stop offset="100%" stop-color="#0d0e13" stop-opacity="0.88" />
    </linearGradient>

    <!-- Centerpiece NodeFrame Gradients -->
    <linearGradient id="node-outer" x1="600" y1="145" x2="600" y2="385" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1c1f28" />
      <stop offset="100%" stop-color="#0e1015" />
    </linearGradient>

    <linearGradient id="node-channel" x1="600" y1="155" x2="600" y2="375" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f1116" />
      <stop offset="100%" stop-color="#090a0d" />
    </linearGradient>

    <linearGradient id="node-chamber" x1="600" y1="165" x2="600" y2="365" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#232733" />
      <stop offset="40%" stop-color="#161820" />
      <stop offset="100%" stop-color="#0d0f14" />
    </linearGradient>

    <linearGradient id="node-border-grad" x1="480" y1="145" x2="720" y2="385" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.5" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.38" />
    </linearGradient>

    <!-- Satellite Node Gradients -->
    <linearGradient id="sat-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#181a22" />
      <stop offset="100%" stop-color="#0e1015" />
    </linearGradient>

    <!-- Photonic Trace Gradients -->
    <linearGradient id="trace-left" x1="160" y1="265" x2="480" y2="265" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.85" />
    </linearGradient>

    <linearGradient id="trace-right" x1="720" y1="265" x2="1040" y2="265" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85" />
      <stop offset="55%" stop-color="#ffffff" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <!-- Shield & Monolith Gradients -->
    <linearGradient id="shield-stroke" x1="0" y1="2" x2="0" y2="22" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#b8c0d0" />
    </linearGradient>

    <linearGradient id="shield-fill" x1="0" y1="2" x2="0" y2="22" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02" />
    </linearGradient>

    <linearGradient id="monolith-fill" x1="0" y1="5" x2="0" y2="17" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#dce2ee" />
    </linearGradient>

    <!-- Title Gradient -->
    <linearGradient id="title-grad" x1="600" y1="450" x2="600" y2="515" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#d0d6e2" />
    </linearGradient>

    <!-- Inkscape-Compatible Blur & Shadow Filters -->
    <filter id="glow-sm" x="-100%" y="-200%" width="300%" height="500%">
      <feGaussianBlur stdDeviation="5" />
    </filter>

    <filter id="glow-lg" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="32" />
    </filter>

    <filter id="vault-shadow" x="-25%" y="-25%" width="150%" height="160%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#000000" flood-opacity="0.82" />
    </filter>

    <clipPath id="og-clip">
      <rect width="1200" height="630" />
    </clipPath>
  </defs>

  <g clip-path="url(#og-clip)">
    <!-- 1. Base Obsidian Stage -->
    <rect width="1200" height="630" fill="url(#canvas-bg)" />
    <rect width="1200" height="630" fill="url(#core-spotlight)" />
    <rect width="1200" height="630" fill="url(#top-horizon)" />

    <!-- 2. Architectural Precision Grid & Axis Lines -->
    <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
      <line x1="0" y1="265" x2="1200" y2="265" />
      <line x1="600" y1="0" x2="600" y2="435" stroke-dasharray="4 6" />
      <line x1="220" y1="0" x2="220" y2="630" />
      <line x1="980" y1="0" x2="980" y2="630" />
      <circle cx="600" cy="265" r="390" stroke-opacity="0.035" />
      <circle cx="600" cy="265" r="290" stroke-opacity="0.05" stroke-dasharray="3 8" />
    </g>

    <!-- 3. Concentric Stepped Rotated Vault Diamonds -->
    <g transform="translate(600 265) rotate(45)">
      <!-- Outer Diamond Ring -->
      <rect
        x="-260"
        y="-260"
        width="520"
        height="520"
        rx="54"
        fill="none"
        stroke="url(#diamond-rim-outer)"
        stroke-width="1.2"
      />
      <!-- Middle Stepped Diamond -->
      <rect
        x="-200"
        y="-200"
        width="400"
        height="400"
        rx="44"
        fill="url(#diamond-surface-md)"
        stroke="url(#diamond-rim-outer)"
        stroke-width="1.4"
      />
      <!-- Inner Stepped Diamond -->
      <rect
        x="-142"
        y="-142"
        width="284"
        height="284"
        rx="34"
        fill="url(#diamond-surface-sm)"
        stroke="url(#diamond-rim-inner)"
        stroke-width="1.5"
      />
    </g>

    <!-- 4. Horizontal Photonic Circuit Traces & Satellite Nodes -->
    <!-- Left Circuit Trace -->
    <line x1="150" y1="265" x2="478" y2="265" stroke="url(#trace-left)" stroke-width="2" />
    <path
      d="M270 265 L305 205 L478 205"
      stroke="url(#trace-left)"
      stroke-width="1.2"
      stroke-opacity="0.65"
      fill="none"
    />
    <path
      d="M270 265 L305 325 L478 325"
      stroke="url(#trace-left)"
      stroke-width="1.2"
      stroke-opacity="0.65"
      fill="none"
    />

    <!-- Right Circuit Trace -->
    <line x1="722" y1="265" x2="1050" y2="265" stroke="url(#trace-right)" stroke-width="2" />
    <path
      d="M930 265 L895 205 L722 205"
      stroke="url(#trace-right)"
      stroke-width="1.2"
      stroke-opacity="0.65"
      fill="none"
    />
    <path
      d="M930 265 L895 325 L722 325"
      stroke="url(#trace-right)"
      stroke-width="1.2"
      stroke-opacity="0.65"
      fill="none"
    />

    <!-- Left Satellite Nodes -->
    <g transform="translate(238 233)">
      <rect
        width="64"
        height="64"
        rx="16"
        fill="url(#sat-surface)"
        stroke="#ffffff"
        stroke-opacity="0.24"
        stroke-width="1.2"
      />
      <rect
        x="8"
        y="8"
        width="48"
        height="48"
        rx="11"
        fill="#0b0c10"
        stroke="#ffffff"
        stroke-opacity="0.14"
        stroke-width="1"
      />
      <!-- Key / Token Glyph -->
      <circle cx="27" cy="32" r="6" stroke="#e2e8f0" stroke-width="2" />
      <path d="M33 32H43M39 32V36M43 32V37" stroke="#e2e8f0" stroke-width="2" stroke-linecap="round" />
      <!-- Right Active Port -->
      <rect x="62.5" y="22" width="3" height="20" rx="1.5" fill="#ffffff" />
    </g>

    <circle cx="372" cy="205" r="4" fill="#0d0f14" stroke="#ffffff" stroke-opacity="0.45" stroke-width="1.5" />
    <circle cx="372" cy="325" r="4" fill="#0d0f14" stroke="#ffffff" stroke-opacity="0.45" stroke-width="1.5" />

    <!-- Right Satellite Nodes -->
    <g transform="translate(898 233)">
      <rect
        width="64"
        height="64"
        rx="16"
        fill="url(#sat-surface)"
        stroke="#ffffff"
        stroke-opacity="0.24"
        stroke-width="1.2"
      />
      <rect
        x="8"
        y="8"
        width="48"
        height="48"
        rx="11"
        fill="#0b0c10"
        stroke="#ffffff"
        stroke-opacity="0.14"
        stroke-width="1"
      />
      <!-- SSO Globe / Network Glyph -->
      <circle cx="32" cy="32" r="10" stroke="#e2e8f0" stroke-width="1.8" />
      <ellipse cx="32" cy="32" rx="4.5" ry="10" stroke="#e2e8f0" stroke-width="1.5" />
      <line x1="22.5" y1="32" x2="41.5" y2="32" stroke="#e2e8f0" stroke-width="1.5" />
      <!-- Left Active Port -->
      <rect x="-1.5" y="22" width="3" height="20" rx="1.5" fill="#ffffff" />
    </g>

    <circle cx="828" cy="205" r="4" fill="#0d0f14" stroke="#ffffff" stroke-opacity="0.45" stroke-width="1.5" />
    <circle cx="828" cy="325" r="4" fill="#0d0f14" stroke="#ffffff" stroke-opacity="0.45" stroke-width="1.5" />

    <!-- 5. Centerpiece Stepped Obsidian Vault Node (240x240 centered at 600,265) -->
    <g transform="translate(480 145)">
      <!-- Photonic Ambient Bloom Behind Vault -->
      <rect
        x="15"
        y="15"
        width="210"
        height="210"
        rx="40"
        fill="#ffffff"
        fill-opacity="0.14"
        filter="url(#glow-lg)"
      />

      <!-- Outer Stepped Obsidian Bezel -->
      <rect
        x="0"
        y="0"
        width="240"
        height="240"
        rx="38"
        fill="url(#node-outer)"
        stroke="url(#node-border-grad)"
        stroke-width="1.5"
        filter="url(#vault-shadow)"
      />

      <!-- Inner Recessed Bevel Channel -->
      <rect
        x="11"
        y="11"
        width="218"
        height="218"
        rx="30"
        fill="url(#node-channel)"
        stroke="#ffffff"
        stroke-opacity="0.24"
        stroke-width="1.2"
      />

      <!-- Inner Vault Chamber -->
      <rect
        x="21"
        y="21"
        width="198"
        height="198"
        rx="22"
        fill="url(#node-chamber)"
        stroke="url(#node-border-grad)"
        stroke-width="1.5"
      />

      <!-- Top Chamber Specular Highlight -->
      <path
        d="M48 22.5H192"
        stroke="#ffffff"
        stroke-opacity="0.32"
        stroke-width="1"
        stroke-linecap="round"
      />

      <!-- Inner Recessed Circular Core Well -->
      <circle
        cx="120"
        cy="120"
        r="68"
        fill="#0a0c10"
        fill-opacity="0.72"
        stroke="#ffffff"
        stroke-opacity="0.16"
        stroke-width="1.2"
      />
      <circle
        cx="120"
        cy="120"
        r="56"
        fill="none"
        stroke="#ffffff"
        stroke-opacity="0.08"
        stroke-width="1"
        stroke-dasharray="3 5"
      />

      <!-- Symmetrical Photonic Light Bars on Vault Corners -->
      <!-- Top-Left & Top-Right -->
      <rect x="42" y="9" width="36" height="4" rx="2" fill="#ffffff" opacity="0.7" filter="url(#glow-sm)" />
      <rect x="44" y="10" width="32" height="2.5" rx="1.25" fill="#ffffff" />

      <rect x="162" y="9" width="36" height="4" rx="2" fill="#ffffff" opacity="0.7" filter="url(#glow-sm)" />
      <rect x="164" y="10" width="32" height="2.5" rx="1.25" fill="#ffffff" />

      <!-- Bottom-Left & Bottom-Right -->
      <rect x="42" y="227" width="36" height="4" rx="2" fill="#ffffff" opacity="0.7" filter="url(#glow-sm)" />
      <rect x="44" y="227.5" width="32" height="2.5" rx="1.25" fill="#ffffff" />

      <rect x="162" y="227" width="36" height="4" rx="2" fill="#ffffff" opacity="0.7" filter="url(#glow-sm)" />
      <rect x="164" y="227.5" width="32" height="2.5" rx="1.25" fill="#ffffff" />

      <!-- Four Polar Port Ticks (Top, Bottom, Left, Right) -->
      <rect x="108" y="-1" width="24" height="4" rx="2" fill="#ffffff" opacity="0.8" filter="url(#glow-sm)" />
      <rect x="110" y="-0.5" width="20" height="2.5" rx="1.25" fill="#ffffff" />

      <rect x="108" y="237" width="24" height="4" rx="2" fill="#ffffff" opacity="0.8" filter="url(#glow-sm)" />
      <rect x="110" y="238" width="20" height="2.5" rx="1.25" fill="#ffffff" />

      <rect x="-1" y="102" width="4" height="36" rx="2" fill="#ffffff" opacity="0.8" filter="url(#glow-sm)" />
      <rect x="-0.5" y="104" width="2.5" height="32" rx="1.25" fill="#ffffff" />

      <rect x="237" y="102" width="4" height="36" rx="2" fill="#ffffff" opacity="0.8" filter="url(#glow-sm)" />
      <rect x="238" y="104" width="2.5" height="32" rx="1.25" fill="#ffffff" />

      <!-- Sculpted Derbent Shield & Monolith Crest (Scaled 4.4x around center 120,120) -->
      <g transform="translate(67.2 67.2) scale(4.4)">
        <!-- Soft Photonic Glow Behind Monolith -->
        <rect
          x="9"
          y="5.5"
          width="6"
          height="11.5"
          rx="1.6"
          fill="#ffffff"
          fill-opacity="0.35"
          filter="url(#glow-sm)"
        />
        <!-- Shield Contour -->
        <path
          d="M11.302 21.6455C11.5234 21.7747 11.6341 21.8393 11.7903 21.8728C11.9116 21.8988 12.0884 21.8988 12.2097 21.8728C12.3659 21.8393 12.4766 21.7747 12.698 21.6455C14.646 20.5091 20 16.9391 20 12.0307V7.24825C20 6.44873 20 6.04898 19.8692 5.70535C19.7537 5.40179 19.566 5.13093 19.3223 4.91618C19.0465 4.67309 18.6722 4.53273 17.9236 4.252L12.5618 2.24132C12.3539 2.16335 12.25 2.12438 12.143 2.10893C12.0482 2.09522 11.9518 2.09522 11.857 2.10893C11.75 2.12438 11.6461 2.16335 11.4382 2.24132L6.0764 4.252C5.3278 4.53273 4.9535 4.67309 4.67766 4.91618C4.43398 5.13093 4.24627 5.40179 4.13076 5.70535C4 6.04898 4 6.44873 4 7.24825V12.0307C4 16.9391 9.35396 20.5091 11.302 21.6455Z"
          fill="url(#shield-fill)"
          stroke="url(#shield-stroke)"
          stroke-width="1.75"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
        <!-- Inner Monolith Pillar -->
        <rect
          x="9.4332"
          y="5.8985"
          width="5.1336"
          height="10.763"
          rx="1.4616"
          ry="1.4616"
          fill="url(#monolith-fill)"
        />
      </g>
    </g>

    <!-- 6. Centered Title Below Logo -->
    <text
      x="600"
      y="505"
      text-anchor="middle"
      fill="url(#title-grad)"
      font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
      font-size="68"
      font-weight="700"
      letter-spacing="-2.2"
    >
      Derbent
    </text>
  </g>
</svg>
